parameters:
    delivering.telnyx.api_key: ''
    delivering.telnyx.from: ''
    delivering.telnyx.public_key: ''
    delivering.telnyx.manager_recipient: ''
    delivering.messenger.async_dsn: 'doctrine://postgres?queue_name=delivering'
    delivering.messenger.failed_dsn: 'doctrine://postgres?queue_name=delivering_failed'
    delivering.apns.team_id: ''
    delivering.apns.key_id: ''
    delivering.apns.private_key: ''
    delivering.apns.topic_map: '{}'
    delivering.apns.environment: 'production'
    delivering.fcm.service_account_json: ''
    delivering.fcm.project_map: '{}'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Delivering\ServiceInterface\Command\Delivery\DeliveryPushProviderInterface:
            tags: ['delivering.push_provider']

    App\Delivering\:
        resource: '../../src/'
        exclude:
            - '../../src/DeliveringBundle.php'

    App\Delivering\Provider\Telnyx\DeliveryTelnyxSmsSender:
        arguments:
            $apiKey: '%env(default:delivering.telnyx.api_key:DELIVERING_TELNYX_API_KEY)%'
            $sender: '%env(default:delivering.telnyx.from:DELIVERING_TELNYX_FROM)%'

    App\Delivering\Provider\Telnyx\DeliveryTelnyxWebhookSignatureVerifier:
        arguments:
            $publicKey: '%env(default:delivering.telnyx.public_key:DELIVERING_TELNYX_PUBLIC_KEY)%'

    App\Delivering\Provider\Telnyx\DeliveryTelnyxConversationNotificationParser:
        arguments:
            $managerRecipient: '%env(default:delivering.telnyx.manager_recipient:DELIVERING_TELNYX_MANAGER_RECIPIENT)%'

    App\Delivering\Provider\Push\DeliveryApnsPushProvider:
        arguments:
            $teamId: '%env(default:delivering.apns.team_id:DELIVERING_APNS_TEAM_ID)%'
            $keyId: '%env(default:delivering.apns.key_id:DELIVERING_APNS_KEY_ID)%'
            $privateKey: '%env(default:delivering.apns.private_key:DELIVERING_APNS_PRIVATE_KEY)%'
            $topicMapJson: '%env(default:delivering.apns.topic_map:DELIVERING_APNS_TOPIC_MAP)%'
            $environment: '%env(default:delivering.apns.environment:DELIVERING_APNS_ENVIRONMENT)%'

    App\Delivering\Provider\Push\DeliveryFcmPushProvider:
        arguments:
            $serviceAccountJson: '%env(default:delivering.fcm.service_account_json:DELIVERING_FCM_SERVICE_ACCOUNT_JSON)%'
            $projectMapJson: '%env(default:delivering.fcm.project_map:DELIVERING_FCM_PROJECT_MAP)%'

    App\Delivering\Service\Query\Push\DeliveryPushReadinessService:
        arguments:
            $apnsTeamId: '%env(default:delivering.apns.team_id:DELIVERING_APNS_TEAM_ID)%'
            $apnsKeyId: '%env(default:delivering.apns.key_id:DELIVERING_APNS_KEY_ID)%'
            $apnsPrivateKey: '%env(default:delivering.apns.private_key:DELIVERING_APNS_PRIVATE_KEY)%'
            $apnsTopicMapJson: '%env(default:delivering.apns.topic_map:DELIVERING_APNS_TOPIC_MAP)%'
            $apnsEnvironment: '%env(default:delivering.apns.environment:DELIVERING_APNS_ENVIRONMENT)%'
            $fcmServiceAccountJson: '%env(default:delivering.fcm.service_account_json:DELIVERING_FCM_SERVICE_ACCOUNT_JSON)%'
            $fcmProjectMapJson: '%env(default:delivering.fcm.project_map:DELIVERING_FCM_PROJECT_MAP)%'

    App\Delivering\ServiceInterface\Command\Receipt\DeliveryReceiptRecorderInterface:
        alias: App\Delivering\Service\Command\Receipt\DeliveryDoctrineReceiptRecorder

    App\Delivering\ServiceInterface\Command\Delivery\DeliverySmsSenderInterface:
        alias: App\Delivering\Provider\Telnyx\DeliveryTelnyxSmsSender

    App\Delivering\ServiceInterface\Command\Delivery\DeliveryPushSenderInterface:
        alias: App\Delivering\Service\Command\Delivery\DeliveryPushSenderRouter

    App\Delivering\ServiceInterface\Command\Delivery\DeliveryPushTokenResolverInterface:
        alias: App\Delivering\Service\Command\Delivery\DeliveryUnavailablePushTokenResolver

    App\Delivering\Service\Command\Delivery\DeliveryPushSenderRouter:
        arguments:
            $providers: !tagged_iterator delivering.push_provider

    App\Delivering\ServiceInterface\Query\Queue\DeliveryQueueStatusProviderInterface:
        alias: App\Delivering\Service\Query\Queue\DeliveryMessengerQueueStatusProvider

    App\Delivering\Service\Query\Queue\DeliveryMessengerQueueStatusProvider:
        arguments:
            $asyncReceiver: '@messenger.transport.delivering_async'
            $failedReceiver: '@messenger.transport.delivering_failed'
